<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contact — unnamed</title>
<meta name="description" content="Get in touch with unnamed. Opens your email app — no servers, no tracking." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html">unnamed<span>.</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main class="container">
  <section class="page-head reveal">
    <p class="kicker">contact</p>
    <h1>Say hi.</h1>
    <p class="lead">Submitting opens your email app with everything pre-filled. No servers, no tracking.</p>
  </section>

  <form id="contactForm" class="contact reveal" novalidate>
    <label class="field"><span>Your name</span><input required name="name" type="text" placeholder="Ada Lovelace" /></label>
    <label class="field"><span>Your email</span><input required name="email" type="email" placeholder="you@domain.com" /></label>
    <label class="field"><span>Project type</span>
      <select name="type">
        <option>Landing page</option>
        <option>Brand site</option>
        <option>Web app MVP</option>
        <option>Redesign</option>
        <option>Other</option>
      </select>
    </label>
    <label class="field"><span>Estimated budget (USD)</span><input name="budget" type="number" min="50" max="200" value="50" /></label>
    <label class="field full"><span>Tell us about it</span><textarea required name="message" rows="6" placeholder="A short description of what you have in mind…"></textarea></label>
    <button class="btn primary" type="submit">Open in email app →</button>
    <p class="muted small">We reply from <a href="mailto:theunnamedproject@proton.me">theunnamedproject@proton.me</a>.</p>
  </form>
</main>

<footer class="foot">
  <span>© <span id="yr"></span> unnamed</span>
  <a href="mailto:theunnamedproject@proton.me">theunnamedproject@proton.me</a>
</footer>

<script src="main.js"></script>
<script src="contact.js"></script>
</body>
</html>
